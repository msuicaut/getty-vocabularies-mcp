[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "getty-vocabularies-mcp"
version = "0.1.0"
description = "An MCP server for Getty Vocabularies (AAT, TGN, ULAN)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "mcp[cli]>=1.0.0",
    "requests>=2.31.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
getty-vocabularies-mcp = "getty_vocabularies_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
